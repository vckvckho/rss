name: Weekly RSS download

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  push:
    branches: [ main ]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS downloader
        run: |
          python rss.py --url "https://www.spreaker.com/show/5277195/episodes/feed" --n 3 --dir downloads

      - name: Upload downloads artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ github.run_id }}
          path: downloads
